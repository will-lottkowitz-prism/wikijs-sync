name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci
      - run: npm run lint
      - run: npm run check-types
      - run: npm run format:check
      - run: npm test
      - run: npm run build
      - run: npx vsce package --no-dependencies --out wikijs-sync.vsix

      - uses: actions/upload-artifact@v4
        with:
          name: vsix
          path: wikijs-sync.vsix
          if-no-files-found: error
