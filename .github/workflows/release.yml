# Generated by the private monorepo's scripts/sync-public.mjs — do not edit here.
#
# On a `v<x.y.z>` tag push: build the .vsix, write latest.json, and publish a
# GitHub Release with both assets. The in-extension self-updater polls
#   https://github.com/will-lottkowitz-prism/wikijs-sync/releases/latest/download/latest.json
# so a new release is all a sideloaded install needs to auto-update.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install
        run: npm ci || npm install

      - name: Lint
        run: npm run lint --if-present

      - name: Build
        run: npm run compile

      - name: Package
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          PKG_VERSION="$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$PKG_VERSION" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version $PKG_VERSION"
            exit 1
          fi
          npx --yes @vscode/vsce@^3 package -o "wikijs-sync-${VERSION}.vsix"

      - name: Build release manifest
        run: node .ci/make-latest-json.mjs "xQx.wikijs-sync" "wikijs-sync" "$GITHUB_REF_NAME"

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          gh release create "$GITHUB_REF_NAME" \
            --title "Wiki.js Sync ${VERSION}" \
            --notes-file .ci/RELEASE_NOTES.md \
            "wikijs-sync-${VERSION}.vsix" \
            latest.json
